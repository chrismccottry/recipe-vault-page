<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>レシピさん テスト</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root { --ink:#3A2A20; --paper:#FBF7F2; --anchor:#C4502A; --muted:#8A7060; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 16px; background:var(--paper); color:var(--ink);
         font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; line-height:1.7; }
  h1 { font-size:18px; margin:0 0 16px; letter-spacing:-0.01em; }
  .row { display:flex; gap:8px; margin:12px 0; }
  input { flex:1; min-width:0; padding:10px 12px; border:1px solid #E0D5C8; border-radius:8px;
          background:#fff; color:var(--ink); font:inherit; }
  input:focus-visible { outline:2px solid var(--anchor); outline-offset:1px; }
  button { padding:10px 14px; border:0; border-radius:8px; background:var(--anchor); color:#fff;
           font:inherit; transition:opacity .15s, transform .15s; }
  button:hover { opacity:.9; }
  button:active { transform:translateY(1px); }
  button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  ul { padding-left:20px; }
  #log { margin-top:20px; padding:12px; background:#fff; border-radius:8px; font-size:13px;
         color:var(--muted); white-space:pre-wrap; word-break:break-all; }
  @media (prefers-reduced-motion: reduce) { button { transition:none; } }
</style>
</head>
<body>
<h1>レシピさん・接続テスト</h1>
<div id="who">確認中…</div>

<div class="row">
  <input id="item" placeholder="テスト項目（例: 牛乳）" autocomplete="off">
  <button id="add">追加</button>
</div>
<button id="reload">読み込み直す</button>
<ul id="list"></ul>

<div id="log"></div>

<script>
// Phase 0 test page. Fill these two in after the console steps, then commit.
const LIFF_ID = "2011674944-nKHWiSdZ";
const API_URL = "https://script.google.com/macros/s/AKfycbyXoLzT2cUlcPx8UorYUusqI_ghLGHUy46JRtRX7WBqMHyioc0rZ42vAb-wQVBCeru2qA/exec";

const log = (...a) => { document.getElementById("log").textContent +=
  a.map(x => typeof x === "string" ? x : JSON.stringify(x)).join(" ") + "\n"; };

// POST as text/plain keeps it a "simple" request, so the browser sends no preflight.
async function api(action, payload) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ action, idToken: liff.getIDToken() }, payload || {}))
  });
  const text = await res.text();
  try { return JSON.parse(text); } catch (e) { throw new Error("bad reply: " + text.slice(0, 300)); }
}

function render(items) {
  document.getElementById("list").innerHTML =
    (items || []).map(t => "<li>" + t.replace(/[<>&]/g, c => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;" }[c])) + "</li>").join("");
}

async function load() {
  const r = await api("list");
  if (r.error) { log("list error:", r.error); return; }
  render(r.items);
  log("list ok:", (r.items || []).length + " items");
}

(async () => {
  try {
    await liff.init({ liffId: LIFF_ID });
    log("liff.init ok");
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const p = await liff.getProfile();
    document.getElementById("who").textContent = "こんにちは、" + p.displayName + " さん";
    log("userId:", p.userId);
    await load();
  } catch (e) {
    document.getElementById("who").textContent = "接続できませんでした";
    log("ERROR:", e.message || String(e));
  }
})();

document.getElementById("add").onclick = async () => {
  const el = document.getElementById("item");
  const v = el.value.trim();
  if (!v) return;
  const r = await api("add", { item: v });
  if (r.error) { log("add error:", r.error); return; }
  el.value = "";
  render(r.items);
};
document.getElementById("reload").onclick = load;
</script>
</body>
</html>
